name: Portfolio projects CI
on:
  push:
    branches: [master, 'cursor/**']
  pull_request:
jobs:
  clipforge-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/clipforge/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q
  streampulse-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/streampulse/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q
  mediavault-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/mediavault/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: PYTHONPATH=$PWD pytest -q
  renderflow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          cd projects/renderflow
          pip install -r api/requirements.txt -r worker/requirements.txt pytest httpx
          pip install ./common || pip install -e ./common || true
          (cd api && PYTHONPATH=../common:$PYTHONPATH pytest -q)
          (cd worker && PYTHONPATH=../common:$PYTHONPATH pytest -q)
