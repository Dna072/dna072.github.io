name: RenderFlow CI

on:
  push:
    branches: [main, master]
    paths:
      - 'projects/renderflow/**'
      - '.github/workflows/renderflow-ci.yml'
  pull_request:
    paths:
      - 'projects/renderflow/**'
      - '.github/workflows/renderflow-ci.yml'

defaults:
  run:
    working-directory: projects/renderflow

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: renderflow
          POSTGRES_PASSWORD: renderflow_dev_password
          POSTGRES_DB: renderflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U renderflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://renderflow:renderflow_dev_password@localhost:5432/renderflow
      REDIS_URL: redis://localhost:6379/0
      FORCE_MOCK_FFMPEG: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            projects/renderflow/api/requirements.txt
            projects/renderflow/worker/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e common -r api/requirements.txt -r worker/requirements.txt pytest ruff

      - name: Ruff (api)
        run: ruff check api/

      - name: Ruff (worker)
        run: ruff check worker/

      - name: Ruff (common)
        run: ruff check common/

      - name: Alembic migrate
        run: cd api && alembic upgrade head

      - name: Pytest (api)
        run: cd api && pytest

      - name: Pytest (worker)
        run: cd worker && pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/renderflow/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/renderflow/frontend/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run lint
          npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    defaults:
      run:
        working-directory: projects/renderflow
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f api/Dockerfile -t renderflow-api:ci .

      - name: Build worker image
        run: docker build -f worker/Dockerfile -t renderflow-worker:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t renderflow-frontend:ci .
