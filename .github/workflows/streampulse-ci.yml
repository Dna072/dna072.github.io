name: StreamPulse CI

on:
  push:
    branches: ["**"]
    paths:
      - "projects/streampulse/**"
      - ".github/workflows/streampulse-ci.yml"
  pull_request:
    paths:
      - "projects/streampulse/**"
      - ".github/workflows/streampulse-ci.yml"

defaults:
  run:
    working-directory: projects/streampulse

jobs:
  backend:
    name: Backend — lint, migrate, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: streampulse
          POSTGRES_PASSWORD: streampulse
          POSTGRES_DB: streampulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streampulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://streampulse:streampulse@localhost:5432/streampulse_test
      TEST_DATABASE_URL: postgresql+psycopg2://streampulse:streampulse@localhost:5432/streampulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/streampulse/backend/requirements.txt
      - name: Install dependencies
        working-directory: projects/streampulse/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Ruff lint
        working-directory: projects/streampulse/backend
        run: ruff check .
      - name: Alembic migrate (schema smoke test)
        working-directory: projects/streampulse/backend
        run: alembic upgrade head
      - name: Pytest
        working-directory: projects/streampulse/backend
        run: pytest

  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/streampulse/frontend/package-lock.json
      - name: Install dependencies
        working-directory: projects/streampulse/frontend
        run: npm ci
      - name: ESLint
        working-directory: projects/streampulse/frontend
        run: npm run lint
      - name: Typecheck
        working-directory: projects/streampulse/frontend
        run: npm run typecheck
      - name: Build
        working-directory: projects/streampulse/frontend
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t streampulse-api ./projects/streampulse/backend
      - name: Build frontend image
        run: docker build -t streampulse-frontend ./projects/streampulse/frontend
