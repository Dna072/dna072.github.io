name: ClipForge CI
on:
  push:
    paths: ['projects/clipforge/**']
  pull_request:
    paths: ['projects/clipforge/**']
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/clipforge/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/clipforge/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f projects/clipforge/docker-compose.yml config
