# ClipForge backend CI — lint, type-check, and test.
#
# NOTE ON MONOREPO EXECUTION:
# GitHub only auto-runs workflows located at the *repository root* under
# `.github/workflows/`. This file lives inside the ClipForge package so the
# project stays self-contained and extractable to its own repo. To activate it
# in this monorepo, copy/symlink it to `.github/workflows/clipforge-backend.yml`
# at the repo root (paths below are already repo-root-relative).
name: clipforge-backend

on:
  push:
    paths:
      - 'projects/clipforge/backend/**'
      - '.github/workflows/clipforge-backend.yml'
  pull_request:
    paths:
      - 'projects/clipforge/backend/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: projects/clipforge/backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/clipforge/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Mypy type-check
        run: mypy app

      - name: Pytest
        env:
          DATABASE_URL: sqlite+pysqlite:///:memory:
          SECRET_KEY: ci-test-secret
        run: pytest -q --cov=app --cov-report=term-missing
