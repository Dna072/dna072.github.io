[project]
name = "clipforge-backend"
version = "1.0.0"
description = "ClipForge — AI video processing & content intelligence platform (backend)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI uses function calls (Depends) in defaults

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/worker.py"]
