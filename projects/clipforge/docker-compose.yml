# ClipForge — full local stack: api, worker, frontend, postgres, redis.
# Copy .env.example to .env first, then run: docker compose up --build
name: clipforge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clipforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipforge}
      POSTGRES_DB: ${POSTGRES_DB:-clipforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-clipforge}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    entrypoint: ['bash', 'scripts/entrypoint.sh']
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clipforge}:${POSTGRES_PASSWORD:-clipforge}@postgres:5432/${POSTGRES_DB:-clipforge}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      STORAGE_DIR: /app/storage
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      SEED_ON_START: ${SEED_ON_START:-true}
    volumes:
      - storage:/app/storage
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ['python', '-m', 'app.workers.processor']
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clipforge}:${POSTGRES_PASSWORD:-clipforge}@postgres:5432/${POSTGRES_DB:-clipforge}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      STORAGE_DIR: /app/storage
    volumes:
      - storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  storage:
