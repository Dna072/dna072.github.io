name: mediavault CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install & test
        run: |
          if [ -d backend ]; then cd backend; elif [ -d api ]; then cd api; fi
          pip install -r requirements.txt pytest httpx || true
          export PYTHONPATH=$PWD
          pytest -q || true
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: |
          cd frontend
          npm ci || npm install
          npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
