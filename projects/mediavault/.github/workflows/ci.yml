# MediaVault CI.
#
# This workflow lives inside projects/mediavault/ so the project is fully
# self-contained and can be extracted to its own repository (Dna072/mediavault)
# where it will run automatically. Paths below are relative to the project root.

name: MediaVault CI

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: .

jobs:
  backend:
    name: Backend — lint & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mediavault
          POSTGRES_PASSWORD: mediavault
          POSTGRES_DB: mediavault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediavault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://mediavault:mediavault@localhost:5432/mediavault_test
      SECRET_KEY: ci-secret
      SIGNED_URL_SECRET: ci-signed-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        working-directory: backend
        run: ruff check app tests
      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run pytest
        working-directory: backend
        run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    name: Frontend — lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm run test
      - name: Production build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t mediavault-api:ci ./backend
      - name: Build frontend image
        run: docker build -t mediavault-frontend:ci ./frontend
