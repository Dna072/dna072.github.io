[project]
name = "mediavault-backend"
version = "1.0.0"
description = "MediaVault — video asset management API (FastAPI, PostgreSQL)"
requires-python = ">=3.12"
readme = "README.md"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/alembic/*", "alembic/*"]
