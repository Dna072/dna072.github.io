services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mediavault
      POSTGRES_PASSWORD: mediavault
      POSTGRES_DB: mediavault
    ports:
      - "5434:5432"
    volumes:
      - mediavault_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediavault"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://mediavault:mediavault@postgres:5432/mediavault
      JWT_SECRET_KEY: local-dev-secret-change-me
      CORS_ORIGINS: http://localhost:5174,http://localhost:3000
      STORAGE_ROOT: /data/storage
    volumes:
      - mediavault_storage:/data/storage
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8001
    ports:
      - "5174:80"
    depends_on:
      - api

volumes:
  mediavault_pg:
  mediavault_storage:
