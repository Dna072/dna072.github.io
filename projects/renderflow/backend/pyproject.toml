[project]
name = "renderflow-backend"
version = "0.1.0"
description = "RenderFlow — distributed media processing platform (API + worker)."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4"]
ignore = [
    "S101",  # asserts are fine in tests
    "E501",  # long lines tolerated (comments/commands)
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
