[project]
name = "renderflow-common"
version = "0.1.0"
description = "Shared models, schemas, config and queue helpers used by the RenderFlow API and worker."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "redis>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["renderflow_common*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: formatting, not CI-worthy. B008: FastAPI's Depends() idiom.
# UP042: `class X(str, Enum)` is kept intentionally for JSON/str
# interop with Pydantic and SQLAlchemy's Enum column type.
ignore = ["E501", "B008", "UP042"]
