<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill:#131722; stroke:#2b3550; stroke-width:1.5; }
      .accent { stroke:#4f8cff; }
      .green { stroke:#1db954; }
      .amber { stroke:#f5a623; }
      .title { fill:#e6e9f0; font-size:15px; font-weight:600; }
      .sub { fill:#9aa4bd; font-size:11px; }
      .lbl { fill:#8aa0c8; font-size:10.5px; }
      .edge { stroke:#64748b; stroke-width:1.5; fill:none; }
      .store { fill:#0f1626; stroke:#2b3550; stroke-width:1.5; }
    </style>
  </defs>

  <rect width="960" height="520" fill="#0b0e14"/>
  <text x="30" y="38" fill="#e6e9f0" font-size="22" font-weight="700">RenderFlow - Distributed Media Processing</text>
  <text x="30" y="58" class="sub">Stateless API + scalable workers, sharing PostgreSQL (state) and Redis (queue).</text>

  <rect class="box accent" x="30" y="110" width="170" height="80" rx="12"/>
  <text x="115" y="145" text-anchor="middle" class="title">React + TS</text>
  <text x="115" y="165" text-anchor="middle" class="sub">Ops Dashboard</text>

  <rect class="box accent" x="300" y="90" width="230" height="150" rx="12"/>
  <text x="415" y="118" text-anchor="middle" class="title">FastAPI API</text>
  <text x="415" y="140" text-anchor="middle" class="sub">routers: jobs / workers / health</text>
  <text x="415" y="160" text-anchor="middle" class="sub">service layer + state machine</text>
  <text x="415" y="180" text-anchor="middle" class="sub">request IDs, structured logs</text>
  <text x="415" y="212" text-anchor="middle" class="lbl">reaper thread recovers dead-worker jobs</text>

  <rect class="store amber" x="620" y="70" width="180" height="70" rx="12"/>
  <text x="710" y="100" text-anchor="middle" class="title">Redis</text>
  <text x="710" y="120" text-anchor="middle" class="sub">priority + delay queue</text>

  <rect class="store green" x="620" y="170" width="180" height="70" rx="12"/>
  <text x="710" y="200" text-anchor="middle" class="title">PostgreSQL</text>
  <text x="710" y="220" text-anchor="middle" class="sub">jobs + heartbeats</text>

  <rect class="box accent" x="300" y="320" width="230" height="140" rx="12"/>
  <text x="415" y="348" text-anchor="middle" class="title">Worker pool (scalable)</text>
  <rect class="store" x="320" y="365" width="60" height="70" rx="8"/>
  <text x="350" y="404" text-anchor="middle" class="sub">W1</text>
  <rect class="store" x="390" y="365" width="60" height="70" rx="8"/>
  <text x="420" y="404" text-anchor="middle" class="sub">W2</text>
  <rect class="store" x="460" y="365" width="60" height="70" rx="8"/>
  <text x="490" y="404" text-anchor="middle" class="sub">W3+</text>

  <rect class="store amber" x="620" y="330" width="150" height="55" rx="12"/>
  <text x="695" y="363" text-anchor="middle" class="title">FFmpeg / ffprobe</text>

  <rect class="store green" x="620" y="405" width="150" height="55" rx="12"/>
  <text x="695" y="430" text-anchor="middle" class="title">Object storage</text>
  <text x="695" y="447" text-anchor="middle" class="sub">local / S3</text>

  <path class="edge" d="M200,150 L300,150" marker-end="url(#arrow)"/>
  <text x="250" y="142" text-anchor="middle" class="lbl">REST /api/v1</text>

  <path class="edge" d="M530,120 L620,105" marker-end="url(#arrow)"/>
  <text x="580" y="104" text-anchor="middle" class="lbl">enqueue</text>

  <path class="edge" d="M530,180 L620,195" marker-end="url(#arrow)"/>
  <text x="580" y="188" text-anchor="middle" class="lbl">read/write</text>

  <path class="edge" d="M530,375 L620,110" marker-end="url(#arrow)"/>
  <text x="600" y="250" text-anchor="middle" class="lbl">dequeue ready</text>

  <path class="edge" d="M530,410 L620,215" marker-end="url(#arrow)"/>
  <text x="560" y="335" text-anchor="middle" class="lbl">claim / heartbeat</text>

  <path class="edge" d="M530,357 L620,357" marker-end="url(#arrow)"/>
  <path class="edge" d="M530,432 L620,432" marker-end="url(#arrow)"/>
</svg>
