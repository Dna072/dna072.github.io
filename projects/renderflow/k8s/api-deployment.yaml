apiVersion: apps/v1
kind: Deployment
metadata:
  name: renderflow-api
  labels:
    app.kubernetes.io/name: renderflow
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: renderflow
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: renderflow
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: renderflow-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: renderflow-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: renderflow-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: media
              mountPath: /data/media
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: media
          emptyDir: {}
