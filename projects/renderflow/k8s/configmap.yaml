apiVersion: v1
kind: ConfigMap
metadata:
  name: renderflow-config
  labels:
    app.kubernetes.io/name: renderflow
data:
  POSTGRES_HOST: "postgres.renderflow.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "renderflow"
  POSTGRES_USER: "renderflow"
  REDIS_URL: "redis://redis.renderflow.svc.cluster.local:6379/0"
  QUEUE_KEY: "renderflow:queue"
  DELAYED_QUEUE_KEY: "renderflow:delayed"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  CORS_ORIGINS: "https://renderflow.example.com"
  LOG_LEVEL: "INFO"
  SCHEDULER_INTERVAL_SECONDS: "5"
  HEARTBEAT_TIMEOUT_SECONDS: "45"
  WORKER_CONCURRENCY: "1"
  WORKER_POLL_TIMEOUT_SECONDS: "5"
  HEARTBEAT_INTERVAL_SECONDS: "10"
  JOB_MAX_RETRIES: "3"
  RETRY_BACKOFF_BASE_SECONDS: "10"
  MEDIA_STORAGE_PATH: "/data/media"
  FORCE_MOCK_FFMPEG: "false"
