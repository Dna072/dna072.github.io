# Apply everything with:  kubectl apply -k projects/renderflow/k8s
# (Create the real Secret first; secret.example.yaml is a placeholder.)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: renderflow
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.example.yaml
  - postgres.yaml
  - redis.yaml
  - api-deployment.yaml
  - api-service.yaml
  - worker-deployment.yaml
  - worker-hpa.yaml
  - frontend.yaml
  - ingress.yaml

images:
  - name: renderflow/api
    newTag: latest
  - name: renderflow/worker
    newTag: latest
  - name: renderflow/frontend
    newTag: latest
