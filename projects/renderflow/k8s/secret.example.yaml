# EXAMPLE ONLY — do not commit real secrets. In production create this via
# `kubectl create secret`, an external secrets operator, or your cloud secret
# manager (AWS Secrets Manager / SSM). Values here are placeholders.
#
#   kubectl create secret generic renderflow-secrets -n renderflow \
#     --from-literal=RENDERFLOW_DATABASE_URL='postgresql+psycopg://renderflow:CHANGE_ME@postgres:5432/renderflow'
#
apiVersion: v1
kind: Secret
metadata:
  name: renderflow-secrets
  namespace: renderflow
  labels:
    app.kubernetes.io/part-of: renderflow
type: Opaque
stringData:
  # For a managed DB (RDS) point this at the RDS endpoint instead of the
  # in-cluster postgres Service.
  RENDERFLOW_DATABASE_URL: "postgresql+psycopg://renderflow:renderflow@postgres:5432/renderflow"
  # Only needed when RENDERFLOW_STORAGE_BACKEND=s3 and not using IRSA/instance roles.
  # AWS_ACCESS_KEY_ID: "REPLACE_ME"
  # AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
