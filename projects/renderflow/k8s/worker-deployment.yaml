apiVersion: apps/v1
kind: Deployment
metadata:
  name: renderflow-worker
  labels:
    app.kubernetes.io/name: renderflow
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: renderflow
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: renderflow
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: renderflow-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: renderflow-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: renderflow-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: media
              mountPath: /data/media
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - "python.*worker.main"
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: media
          emptyDir: {}
