# Horizontal Pod Autoscaler for workers. Media transcoding is CPU-bound, so we
# scale on CPU utilisation. In a real cluster you'd typically scale on queue
# depth via a custom/external metric (e.g. KEDA with a Redis scaler) — see the
# commented external-metric block for that pattern.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: renderflow-worker
  namespace: renderflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: renderflow-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Preferred in production: scale on Redis queue depth (requires KEDA or a
    # custom metrics adapter exposing this external metric).
    # - type: External
    #   external:
    #     metric:
    #       name: renderflow_queue_depth
    #     target:
    #       type: AverageValue
    #       averageValue: "30"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 15
